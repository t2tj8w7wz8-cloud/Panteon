<style id="catalog-vinetas-prueba-1">
/* Solo Catálogo. No interviene en los estilos ni archivos de Inicio. */
.catalog-panels{display:block;position:relative;padding:12px;overflow:hidden;height:186.67px}
.catalog-stage{width:100%;height:100%;position:relative;isolation:isolate}
.catalog-geometry{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.catalog-geometry path{fill:var(--ivory);stroke:var(--ink);stroke-width:2;stroke-linejoin:miter;stroke-linecap:butt}
.catalog-right{display:contents}
.catalog-stage .catalog-tile,
.catalog-stage .catalog-tile.left,
.catalog-stage .catalog-tile.top,
.catalog-stage .catalog-tile.bottom{
 position:absolute;inset:0;width:100%;height:100%;min-height:0;min-width:0;
 margin:0;padding:0;border:0;border-radius:0;background:transparent;
 display:block;z-index:1;cursor:pointer;font-weight:900;color:var(--ink);font-size:clamp(1.6rem,3vw,2.2rem);
 clip-path:var(--panel-shape,polygon(0 0,100% 0,100% 100%,0 100%));
}
.catalog-stage .catalog-tile.active{color:var(--red)}
.catalog-stage .catalog-tile.left,.catalog-stage .catalog-tile.left.active{color:var(--ink)}
.catalog-stage .catalog-tile span{position:absolute;left:var(--text-x,50%);top:var(--text-y,50%);transform:translate(-50%,-50%) scaleX(var(--fit-x,1));white-space:nowrap;line-height:1.03;text-align:center;pointer-events:none}
.catalog-mobile-break{display:none}
.catalog-stage .catalog-tile:focus-visible{outline:none}
.catalog-stage .catalog-tile:focus-visible span{outline:3px solid var(--red);outline-offset:5px}
@media(max-width:600px){.catalog-panels{height:153.33px}.catalog-stage .catalog-tile{font-size:clamp(1.6rem,3vw,2.2rem)}.catalog-mobile-break{display:block}.catalog-stage .catalog-tile span{line-height:.88}}
</style>

<script id="catalog-geometry-script">
/* Tres polígonos: borde izquierdo en «<», 12 px libres entre bordes,
   tanto en diagonales como entre las viñetas derechas. */
(function(){
 const stage=document.querySelector('.catalog-stage');
 const svg=document.getElementById('catalogGeometry');
 if(!stage||!svg)return;
 const buttons=[stage.querySelector('.catalog-tile.left'),stage.querySelector('.catalog-tile.top'),stage.querySelector('.catalog-tile.bottom')];
 const paths=[document.getElementById('catalogLeftShape'),document.getElementById('catalogTopShape'),document.getElementById('catalogBottomShape')];
 const visibleGap=12, lineWidth=2;
 const round=n=>Number(n.toFixed(2));
 const polygon=pts=>'polygon('+pts.map(([x,y])=>`${round(x)}px ${round(y)}px`).join(',')+')';
 const path=pts=>pts.map(([x,y],i)=>(i?'L':'M')+round(x)+' '+round(y)).join(' ')+' Z';
 function draw(){
  const w=stage.clientWidth,h=stage.clientHeight;
  if(w<1||h<1)return;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const half=h/2, edge=1, xTop=w*.58;
  const depth=Math.min(h*.30,w*.16);
  const xTip=xTop-depth;
  const slope=depth/half;
  const centerlineGap=visibleGap+lineWidth;
  const diagonalXOffset=centerlineGap*Math.sqrt(1+slope*slope);
  const upperBottom=half-centerlineGap/2;
  const lowerTop=half+centerlineGap/2;
  const xAt=y=>xTip+depth*Math.abs(y-half)/half;
  const left=[[edge,edge],[xTop,edge],[xTip,half],[xTop,h-edge],[edge,h-edge]];
  const upper=[[xTop+diagonalXOffset,edge],[w-edge,edge],[w-edge,upperBottom],[xAt(upperBottom)+diagonalXOffset,upperBottom]];
  const lower=[[xAt(lowerTop)+diagonalXOffset,lowerTop],[w-edge,lowerTop],[w-edge,h-edge],[xTop+diagonalXOffset,h-edge]];
  [left,upper,lower].forEach((points,i)=>{
   paths[i].setAttribute('d',path(points));
   buttons[i].style.setProperty('--panel-shape',polygon(points));
  });
  const labels=[[xTop*.41,half],[(xTop+diagonalXOffset+w)/2,half*.52],[(xTop+diagonalXOffset+w)/2,half*1.48]];
  labels.forEach(([x,y],i)=>{
   buttons[i].style.setProperty('--text-x',round(100*x/w)+'%');
   buttons[i].style.setProperty('--text-y',round(100*y/h)+'%');
  });
  // Respeta la jerarquía tipográfica del subtítulo sin cortar nombres largos en móvil.
  buttons.forEach((button,i)=>{
   const label=button.querySelector('span');
   label.style.setProperty('--fit-x','1');
   const leftLimit=i===0?8:Math.max(xTop+diagonalXOffset, xTip+diagonalXOffset)+8;
   const rightLimit=i===0?xTip-10:w-8;
   const available=i===0?Math.max(50,2*Math.min(labels[i][0]-8,xTip-8)):
    Math.max(50,2*Math.min(labels[i][0]-leftLimit,rightLimit-labels[i][0]));
   const width=label.getBoundingClientRect().width;
   label.style.setProperty('--fit-x',round(Math.min(1,available/Math.max(width,1))));
  });
 }
 draw();
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(draw).observe(stage);
 else addEventListener('resize',draw,{passive:true});
})();
</script>
