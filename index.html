<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantéon v1.1 · Inicio</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="original" title="Inicio aprobado Pantéon v1.0" src="inicio-v1.0.html"></iframe><script>
const frame=document.getElementById('original');frame.onload=()=>{const d=frame.contentDocument;d.addEventListener('click',e=>{const dest=e.target.closest('[data-dest]');const series=e.target.closest('[data-series]');if(dest&&dest.dataset.dest==='catalogo'){e.stopImmediatePropagation();e.preventDefault();location.href='catalogo.html'}else if(series&&!e.target.closest('button')){e.stopImmediatePropagation();e.preventDefault();location.href='serie.html?serie='+encodeURIComponent(series.dataset.series)}},true);d.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('[data-series]')){e.preventDefault();location.href='serie.html?serie='+encodeURIComponent(e.target.closest('[data-series]').dataset.series)}},true)};
</script></body></html>
